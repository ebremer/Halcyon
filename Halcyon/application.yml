keycloak:
  server:
    contextPath: /auth
    username: admin
    password: admin
server:
  port: 8888
  http2:
    enabled: true
  ssl:
    bundle: server
    enabled-protocols: TLSv1.3
  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 200MB
      file-size-threshold: 2MB
    session:
      timeout: 900
  jetty:
    connection-idle-timeout: 900000    
spring:
  main:
    keep-alive: false
    lazy-initialization: false
    allow-circular-references: true
  threads:
    virtual:
      enabled: false
#  datasource:
#    url: jdbc:h2:mem:testdb
#    driver-class-name: org.h2.Driver
#    username: sa
#    password: 
  h2:
    console:
      enabled: true    
  ssl:
    bundle:
      jks:
        server:
          key:
            alias: "halcyon"
          keystore:
            location: "./halcyonkeystore.jks"
            password: "password"
            type: "JKS"
          truststore:
            location: "./halcyontruststore.jks"
            password: "password"
            type: "JKS"

logging:
  file:
    name: logs/halcyon.log
    max-size: 100MB
    max-history: 10
  level:
    root: ERROR
    com.ebremer.halcyon.filesystem.DirectoryProcessor: INFO
    #com.ebremer.halcyon.server.ldp: DEBUG
